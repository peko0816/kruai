[project]
name = "kruai-backend"
version = "0.1.0"
description = "KruAI backend: Khmer-first Chinese speaking coach"
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "structlog>=24.4",
    "httpx>=0.27",
    "python-telegram-bot>=21.6",
]

[dependency-groups]
dev = [
    "ruff>=0.6.9",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "types-redis>=4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Ruff (lint + format + isort)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "F", "W",       # pyflakes / pycodestyle
    "I",                 # isort
    "B",                 # bugbear
    "UP",                # pyupgrade
    "SIM",               # simplify
    "RUF",               # ruff-specific
    "N",                 # pep8-naming
    "C4",                # comprehensions
    "ASYNC",             # async best-practice
]
ignore = [
    "E501",              # line-length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]    # allow long test names in unusual cases

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy (strict)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["telegram.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
filterwarnings = ["error"]
