[project]
name = "kruai-backend"
version = "0.1.0"
description = "KruAI backend: Khmer-first Chinese speaking coach"
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "structlog>=24.4",
    "httpx>=0.27",
    "python-telegram-bot>=21.6",
    # Session tokens. Hand-rolling HS256 is thirty lines and one of them is the
    # alg-confusion check everybody forgets; this library pins the algorithm and
    # validates exp/iss itself.
    "pyjwt>=2.9",
    # ASGI server behind `make run`. No [standard] extra: uvloop and httptools
    # are a deployment choice, and pulling them in here would make the dev
    # install differ from what a container image would install.
    "uvicorn>=0.30",
    # Starlette parses multipart bodies only when this is installed, and
    # POST /attempts is a file upload. Without it FastAPI raises at import of
    # the route, not at request time.
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "ruff>=0.6.9",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # The integration suite is bound by round trips to PostgreSQL, not by CPU,
    # so it parallelises almost perfectly. Each worker is its own process and
    # therefore builds its own scratch database and takes its own Redis
    # logical database (tests/integration/conftest.py).
    "pytest-xdist>=3.6",
    # Test-only. FakeLLM claims its output satisfies the caller's json_schema;
    # this checks that claim against a real validator instead of against our own
    # reading of the spec. Never imported by app code.
    "jsonschema>=4.23",
    "types-jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Ruff (lint + format + isort)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "alembic/versions",
    # The four provider base.py files are verbatim copies of interfaces/*.py,
    # which CLAUDE.md section 4 declares normative: copied as-is, signatures
    # unchanged. They are a specification artifact, not our code, so styling
    # them to our rules is meaningless — and two of ruff's suggestions would
    # actually break the contract. RUF002/RUF003 flag the full-width punctuation
    # that Chinese prose requires, and UP042 wants `class Language(str, Enum)`
    # rewritten as StrEnum, which changes what str() returns.
    #
    # Listed one by one rather than globbed: a future base.py under a domain
    # service (mastery/, media/) is our code and must stay linted.
    #
    # tests/unit/test_provider_interfaces_are_verbatim.py asserts byte equality
    # with interfaces/, so this exemption cannot hide drift.
    "app/services/scoring/base.py",
    "app/services/tts/base.py",
    "app/services/payments/base.py",
    "app/services/llm/base.py",
]

[tool.ruff.lint]
select = [
    "E", "F", "W",       # pyflakes / pycodestyle
    "I",                 # isort
    "B",                 # bugbear
    "UP",                # pyupgrade
    "SIM",               # simplify
    "RUF",               # ruff-specific
    "N",                 # pep8-naming
    "C4",                # comprehensions
    "ASYNC",             # async best-practice
]
ignore = [
    "E501",              # line-length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]    # allow long test names in unusual cases
# CODING_STANDARDS section 5.1 names these exceptions normatively
# (InsufficientQuota, NotSubscribed). The doc wins over N818's Error suffix.
"app/core/errors.py" = ["N818"]

[tool.ruff.lint.isort]
# The local backend/alembic/ directory makes ruff read the installed `alembic`
# package as first-party. It is not.
known-third-party = ["alembic"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy (strict)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]
# ../bot is a sibling package, not part of the backend distribution: it is a
# separate process that talks to the API over HTTP (ARCHITECTURE section 1).
# It shares this toolchain rather than carrying a second one, because two
# ruff/mypy/pytest configurations drift and only one of them gets updated.
files = ["app", "tests", "../bot"]
mypy_path = ".."
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["telegram.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests", "../bot/tests"]
# The bot imports as a top-level `bot` package from the repository root.
pythonpath = [".."]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
filterwarnings = ["error"]
markers = [
    "integration: needs a live PostgreSQL (docker compose up -d); skipped when unreachable",
]
