name: CI

# Every provider stays `fake` here — that is the whole point. Gate G-B requires
# the system to run end to end with no vendor credentials, so CI proves it on
# every pull request rather than at milestone time.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest

    services:
      # Credentials must match DATABASE_URL in .env.example, which is copied to
      # .env below. Keeping CI on the same template developers use means a
      # broken template fails here instead of on someone's laptop.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kruai
          POSTGRES_PASSWORD: kruai_dev
          POSTGRES_DB: kruai
          TZ: UTC
          PGTZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kruai -d kruai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # Added with D6, the first thing in the repository that connects to Redis
      # (the bot keeps each learner's place in a lesson there). Without it those
      # tests would skip, and the integration fixtures deliberately refuse to
      # skip under CI — a silently skipped test is worse than a red one.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Provide configuration
        # Settings declares the 11 secrets as required with no defaults
        # (docs/DECISIONS.md D-004), so the file has to exist and carry every
        # key. Blank values are correct: nothing here talks to a real vendor.
        run: cp .env.example .env

      - name: Verify the lockfile is current
        # A lockfile that drifted from pyproject.toml makes this build
        # unreproducible and would resolve different versions than developers ran.
        run: uv lock --directory backend --check

      - name: Install dependencies
        run: make sync

      - name: Run checks
        # ruff + ruff format + mypy strict + pytest, the same command that gates
        # a local commit. The integration tests refuse to skip when CI is set,
        # so a misconfigured postgres service fails the job instead of quietly
        # dropping the schema guards.
        run: make check

      - name: Report translation progress
        # Deliberately not a gate. Every string is a placeholder until a native
        # speaker writes the Khmer (PRD 15.3 item 3), and a build held red for
        # weeks is a build somebody switches off. The structural half of the
        # check — same keys in every locale, no unknown keys, no copy written in
        # Python — runs inside `make check` above and does fail. The launch gate
        # is `make i18n-strict`, which docs/DEFINITION_OF_DONE.md runs before M2.
        run: make i18n

      - name: Self-check the shipped configuration
        # A different assertion from the test suite: this reads the real .env
        # rather than one a test constructed, so it proves the template we tell
        # people to copy is a configuration the application can actually boot
        # with. That is gate G-B stated as a command.
        run: make selfcheck
