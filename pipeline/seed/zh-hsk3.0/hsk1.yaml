# HSK1 concept skeletons — BACKLOG E2.
#
# One concept per level-1 grammar point of 《国际中文教育中文水平等级标准》
# (GF 0025-2021) appendix A, which numbers them 一01 through 一48 and then
# moves on to level 2. That list is closed, so "is HSK1 complete?" is a
# question a test can answer: pipeline/tests/test_seed_hsk1.py asserts this
# file carries all 48 and nothing else (docs/DECISIONS.md D-082).
#
# The mapping is deliberately one-to-one rather than curated. Some items are
# sentence-constituent descriptions rather than things a learner drills
# (一24 "a noun can be the subject"), and a few overlap (一21 and 一41 are both
# 了₁). Merging them would make the file read better and would make coverage
# unprovable, which is the wrong trade at seed time — choosing what goes into
# a lesson happens later, from lessons.concept_ids, not here.
#
# km_explanation is a placeholder throughout: generate.py drafts the Khmer and
# a native speaker reviews it (D-081). English must never appear in that field.
#
# common_l1_errors is empty on purpose. PRD 3.2 says those come from人工 input
# and attempt data; inventing Khmer-L1 error pairs without a Khmer speaker
# would put invented teaching content in front of learners.
#
# hskk_task_types follows one stated rule (D-083):
#   · every level-1 point can turn up in a 听后重复 sentence  -> listen_and_repeat
#   · the question forms (一04 一33 一45-一48)                -> + listen_and_answer
#                                                              + answer_questions
#   · patterns that stand alone as a spoken answer            -> + listen_and_answer
# Confirm the mapping once during the M1 content review.

schema_version: 1

meta:
  language: zh
  level: HSK1
  licence: >-
    Concept skeletons derived from public national standards and examination
    syllabuses. No publisher textbook material (PRD 5.5).
  sources:
    - id: zh.standard.2021
      detail: >-
        附录A 语法等级大纲, A.1 一级语法点 (items 一01-一48), including the
        example sentences quoted under each item.
    - id: zh.hskk.syllabus
      detail: HSKK 初级 task types (听后重复 / 听后回答 / 回答问题).

